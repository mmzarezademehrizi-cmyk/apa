<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<title>پیام</title>
<style>
@font-face{font-family:Vazirmatn;src:url(fonts/Vazirmatn.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--pri:#2563eb;--pri2:#1d4ed8;--ink:#0f172a;--mut:#64748b;--bg:#f8fafc;--card:#fff;--line:rgba(226,232,240,.85);--chip:#e5eeff;--chipt:#1d4ed8;--field:#f1f5f9;--glass:rgba(255,255,255,.86);--ok:#10b981;--red:#dc2626;--redbg:#fee2e2;--sh:0 2px 8px -2px rgba(15,23,42,.05),0 1px 3px -1px rgba(15,23,42,.03)}
[data-theme=dark]{--ink:#e2e8f0;--mut:#94a3b8;--bg:#0b1220;--card:#131c2e;--line:rgba(51,65,85,.7);--chip:#1b2a4a;--chipt:#93b4ff;--field:#1a2438;--glass:rgba(11,18,32,.86);--redbg:#3b1219}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Vazirmatn,system-ui,sans-serif;background:#e8eef9;color:var(--ink);display:flex;justify-content:center;align-items:center;line-height:1.6;font-variant-numeric:tabular-nums}
[data-theme=dark] body{background:#05080f}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
#app{width:100%;max-width:480px;height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){#app{height:min(100dvh - 32px,880px);border-radius:28px;box-shadow:0 20px 60px -10px rgba(15,23,42,.25)}}
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);z-index:5}
.top h1{font-size:20px;font-weight:700;color:var(--pri);flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.ib:active{background:var(--chip)}
.ib.pri{background:var(--chip);color:var(--chipt)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 24px}
.nav{display:flex;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:6px 0;position:relative}
.nav a.on{color:var(--pri);font-weight:600}
.bdg{position:absolute;top:0;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--pri);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.av{--s:48px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:calc(var(--s)*.36);position:relative;flex:none;border:2px solid var(--card)}
.av i.on{position:absolute;bottom:0;inset-inline-start:0;width:calc(var(--s)*.24);height:calc(var(--s)*.24);min-width:9px;min-height:9px;background:var(--ok);border:2px solid var(--card);border-radius:50%}
.ring{padding:3px;border-radius:50%;background:conic-gradient(var(--pri),#38bdf8,var(--pri))}
.ring.seen{background:var(--line)}
.ring .av{border-width:3px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;flex:none;width:64px}
.plus{position:absolute;bottom:-2px;inset-inline-end:-2px;width:22px;height:22px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;border:2px solid var(--bg);font-size:16px;line-height:1}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:var(--mut);margin:14px 4px 8px}
.sec a{color:var(--pri);font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.chip{flex:none;padding:6px 14px;border-radius:99px;background:var(--chip);color:var(--chipt);font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center}
.chip.on{background:var(--pri);color:#fff}
.chip b{background:rgba(255,255,255,.25);border-radius:99px;padding:0 7px;font-size:11px}
.chip:not(.on) b{background:var(--pri);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:72px;cursor:pointer;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:rgba(37,99,235,.06)}
.row .m{flex:1;min-width:0}
.row .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.row .n{font-weight:600;font-size:15px;display:flex;gap:5px;align-items:center;min-width:0}
.row .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tm{font-size:12px;color:var(--mut);flex:none}
.row .b{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:2px}
.row .l{font-size:13.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l em{color:var(--pri);font-style:normal;font-weight:600}
.ub{min-width:22px;height:22px;border-radius:11px;background:var(--pri);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.vf{flex:none}
.fab{position:absolute;inset-inline-start:20px;bottom:calc(84px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px -4px rgba(37,99,235,.4);z-index:4}
.fab:active{background:var(--pri2);transform:scale(.96)}
.search{display:none;padding:8px 16px;background:var(--glass)}
.search.on{display:block}
.search input,.comp input{width:100%;border:0;outline:0;background:var(--field);border-radius:99px;padding:10px 16px;font:inherit;color:var(--ink)}
.search input:focus,.comp input:focus{box-shadow:0 0 0 1.5px #3b82f6}
.empty{text-align:center;color:var(--mut);padding:40px 0;font-size:14px}
.chead{cursor:pointer;flex:1;display:flex;gap:10px;align-items:center;min-width:0}
.chead b{font-size:16px;display:flex;gap:4px;align-items:center}
.chead small{font-size:12px;color:var(--ok);display:block;line-height:1.3}
.chead small.off{color:var(--mut)}
#msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.day{align-self:center;background:var(--chip);color:var(--chipt);font-size:12px;padding:3px 14px;border-radius:99px;margin-bottom:4px}
.msg{max-width:82%;display:flex;flex-direction:column;position:relative;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.msg.me{align-self:flex-end}
.msg.them{align-self:flex-start}
.bub{padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.7;word-break:break-word}
.me .bub{background:var(--pri);color:#fff;border-end-end-radius:4px;border-end-start-radius:20px}
.them .bub{background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);border-end-start-radius:4px}
.who{font-size:12px;font-weight:600;color:var(--pri);margin-bottom:2px}
.meta{display:flex;gap:4px;align-items:center;font-size:11px;margin-top:2px;justify-content:flex-start}
.me .meta{color:#bfdbfe}
.them .meta{color:var(--mut)}
.tick{color:#fff}.tick.seen{color:#6ee7b7}
.rp{border-inline-start:3px solid var(--pri);background:rgba(37,99,235,.08);border-radius:8px;padding:4px 10px;margin-bottom:6px;font-size:13px}
.rp b{display:block;color:var(--pri);font-size:12px}
.rp span{color:var(--mut)}
.file{border-radius:12px;overflow:hidden;margin-bottom:6px;position:relative;min-width:200px}
.file .ph{height:120px;background:linear-gradient(135deg,#93c5fd,#c4b5fd 55%,#fda4af)}
.file .fn{position:absolute;bottom:8px;inset-inline-start:8px;background:rgba(15,23,42,.6);color:#fff;font-size:12px;padding:3px 10px;border-radius:99px;display:flex;gap:4px;align-items:center;direction:ltr}
.rx{position:absolute;bottom:-12px;inset-inline-end:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh);border-radius:99px;font-size:12px;padding:1px 8px}
.msg.hasrx{margin-bottom:12px}
.voice{display:flex;align-items:center;gap:10px;min-width:210px;direction:ltr}
.pb{width:40px;height:40px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none}
.me .pb{background:#fff;color:var(--pri)}
.wf{display:flex;align-items:center;gap:2px;height:30px;flex:1}
.wf i{width:3px;border-radius:2px;background:currentColor;opacity:.3}
.wf i.on{opacity:1;color:var(--pri)}
.me .wf i.on{color:#fff}
.spd{font-size:11px;background:var(--chip);color:var(--chipt);border-radius:99px;padding:1px 8px;font-weight:600}
.typing{align-self:flex-start;background:var(--chip);color:var(--chipt);font-size:12px;padding:4px 14px;border-radius:99px;display:flex;gap:6px;align-items:center}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--pri);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{50%{opacity:.25;transform:translateY(-2px)}}
.comp{display:flex;gap:8px;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.comp .f{flex:1;display:flex;align-items:center;background:var(--field);border-radius:99px;padding:0 6px}
.comp .f input{background:none;padding:10px 6px}
.comp .f .ib{width:36px;height:36px;color:var(--mut)}
.send{width:46px;height:46px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 8px 24px -4px rgba(37,99,235,.35)}
.send:active{transform:scale(1.04);background:var(--pri2)}
.ro{flex:1;text-align:center;color:var(--mut);font-size:13px;padding:10px}
.hero{text-align:center;padding:22px 16px}
.hero .av{margin:0 auto 12px;border:4px solid var(--chip)}
.hero h2{font-size:22px;display:flex;gap:6px;justify-content:center;align-items:center}
.pill{display:inline-block;background:var(--chip);color:var(--chipt);border-radius:99px;padding:2px 12px;font-size:13px;margin:6px 3px;direction:ltr}
.hero p{color:var(--mut);font-size:14px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.act{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;box-shadow:var(--sh)}
.act span.c{width:46px;height:46px;border-radius:50%;background:var(--chip);color:var(--chipt);display:grid;place-items:center}
.act.pr span.c{background:var(--pri);color:#fff}
.act.on span.c{background:var(--red);color:#fff}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.li+.li{border-top:1px solid var(--line)}
.li:active{background:rgba(37,99,235,.06)}
.li .ico{width:42px;height:42px;border-radius:12px;background:var(--chip);color:var(--chipt);display:grid;place-items:center;flex:none}
.li .tx{flex:1;min-width:0}
.li .tx b{font-size:14.5px;display:flex;gap:6px;align-items:center}
.li .tx small{display:block;color:var(--mut);font-size:12.5px;line-height:1.5}
.li .ch{color:var(--mut)}
.li.red .ico{background:var(--redbg);color:var(--red)}.li.red b{color:var(--red)}
.tag{font-size:11px;background:var(--chip);color:var(--chipt);border-radius:99px;padding:0 8px;font-weight:500}
.tg{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--pri)}
.tg.on::after{inset-inline-end:23px}
.h3{font-size:13px;font-weight:700;color:var(--pri);margin:18px 6px 8px}
.media{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 14px 14px}
.media div{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.gold{background:linear-gradient(135deg,var(--chip),var(--card));padding:14px;display:flex;gap:12px;align-items:center;border-radius:14px;margin-top:12px;cursor:pointer}
.gold .ico{width:38px;height:38px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center}
.me-card{padding:16px}
.me-card .top2{display:flex;gap:12px;align-items:center}
.ver{text-align:center;color:var(--mut);font-size:12px;padding:18px 0 4px}
.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:99px;padding:8px 18px;font-size:13px;z-index:30;animation:pop .2s;white-space:nowrap}
.call{position:absolute;inset:0;z-index:40;background:linear-gradient(160deg,#0f172a,#1e3a8a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:70px 20px 60px}
.call .av{--s:128px;border-color:rgba(255,255,255,.2)}
.call h2{margin-top:18px;text-align:center}
.call p{opacity:.7;text-align:center}
.end{width:64px;height:64px;border-radius:50%;background:#ef4444;display:grid;place-items:center;color:#fff}
.auth{flex:1;min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;background:radial-gradient(900px 420px at 50% -8%,rgba(37,99,235,.2),transparent),var(--bg)}
.authov{position:fixed;inset:0;z-index:100;display:flex;background:var(--bg)}
.acard{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px -20px rgba(15,23,42,.3)}
.alogo{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;display:grid;place-items:center;margin:0 auto}
.acard h1{text-align:center;font-size:22px;color:var(--ink)}
.asub{text-align:center;color:var(--mut);font-size:14px;margin-top:-6px}
.atabs{display:flex;background:var(--field);border-radius:99px;padding:4px}
.atabs button{flex:1;padding:8px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mut)}
.atabs button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.acard label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
.acard input{width:100%;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:11px 14px;font:inherit;color:var(--ink);outline:0;text-align:left}
.acard input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.pw{position:relative;display:block}
.pw input{padding-inline-start:64px}
.pw button{position:absolute;inset-inline-start:6px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--pri);font-weight:700;padding:4px 8px}
.hint{color:var(--mut);font-size:12px;margin-top:-4px}
.aerr{min-height:20px;color:var(--red);font-size:13px;font-weight:600}
.abtn{background:var(--pri);color:#fff;border-radius:99px;padding:12px;font-weight:700;font-size:15px}
.abtn:disabled{opacity:.6}
.anote{text-align:center;color:var(--mut);font-size:11.5px}
</style>
</head>

 return `<div class="msg ${me?'me':'them'} ${m.react?'hasrx':''}" data-i="${i}"><div class="bub">${b}${meta}</div>${m.react?`<span class="rx">${m.rc>1?fa(m.rc)+' ':''}${m.react}</span>`:''}</div>`}
const msgsHTML=c=>`<div class="day">امروز، ${today()}</div>`+c.msgs.map((m,i)=>msgHTML(m,i,c)).join('')+(typingId===c.id?`<div class="typing"><i></i><i></i><i></i> ${esc(c.name.split(' ')[0])} در حال نوشتن…</div>`:'');
function chatView(id){const c=S.chats.find(x=>x.id===id);if(!c)return chatsView();if(c.unread){c.unread=0;save()}
 const p=PEOPLE[id];const st=c.type==='personal'?(typingId===id?'در حال نوشتن…':p&&p.on?'آنلاین':'به‌تازگی آنلاین بوده'):c.type==='group'?fa(c.msgs.length+8)+' عضو':fa('۱۲۴۰۰')+' دنبال‌کننده';
 return `<header class="top"><a class="ib" href="#chats" aria-label="بازگشت">${ic('back')}</a><div class="chead" ${c.type==='personal'?`data-go="profile/${id}"`:''}>${av(c.name,40,p&&p.on)}<div style="min-width:0"><b>${esc(c.name)}${c.vf||(p&&p.vf)?VF:''}</b><small class="${p&&p.on?'':'off'}" id="st">${st}</small></div></div><button class="ib pri" data-call="${id}" data-v="1" aria-label="تصویری">${ic('video',20)}</button><button class="ib pri" data-call="${id}" aria-label="تماس">${ic('phone',20)}</button></header><div id="msgs">${msgsHTML(c)}</div>`+
 (c.type==='channel'?`<div class="comp"><div class="ro">فقط ادمین‌ها می‌توانند پیام ارسال کنند</div></div>`:S.blocked[id]?`<div class="comp"><div class="ro">این مخاطب را مسدود کرده‌اید</div></div>`:`<div class="comp"><div class="f"><button class="ib" data-toast="دوربین" aria-label="دوربین">${ic('cam',20)}</button><button class="ib" data-toast="پیوست" aria-label="پیوست">${ic('clip',20)}</button><input id="in" autocomplete="off" placeholder="پیام خود را بنویسید…" enterkeyhint="send"><button class="ib" data-act="emoji" aria-label="ایموجی">${ic('smile',20)}</button></div><button class="send" data-act="send" aria-label="ارسال">${ic('send',20)}</button></div>`)}
function route(){const [p,id]=(location.hash.slice(1)||'chats').split('/');return{p,id}}
function render(){const{p,id}=route();stopPlay();
 if(!Auth.user()){app.innerHTML=Auth.view();Auth.bind(render);return}
 if(p==='open'){let c=S.chats.find(x=>x.id===id);if(!c&&PEOPLE[id]){c={id,name:PEOPLE[id].name,type:'personal',time:now(),last:'',msgs:[]};S.chats.push(c);save()}return location.replace('#chat/'+id)}
 app.innerHTML=p==='chat'?chatView(id):p==='profile'?profileView(id):p==='calls'?callsView():p==='contacts'?contactsView():p==='settings'?settingsView():chatsView();
 const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
 if(p==='chats'&&q){const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)}}
function refreshMsgs(){const c=S.chats.find(x=>x.id===route().id),m=$('#msgs');if(!c||!m)return;m.innerHTML=msgsHTML(c);m.scrollTop=m.scrollHeight;const s=$('#st');if(s&&c.type==='personal'){s.textContent=typingId===c.id?'در حال نوشتن…':PEOPLE[c.id]&&PEOPLE[c.id].on?'آنلاین':'به‌تازگی آنلاین بوده'}}
const REPLIES=['باشه، ممنون! 🙏','عالیه 👌','بذار یه نگاه بندازم و خبرت می‌کنم','حتماً، فردا در موردش صحبت می‌کنیم','😂👍','دمت گرم، دقیقاً همین رو می‌خواستم'];
function send(){const i=$('#in'),t=i&&i.value.trim(),id=route().id,c=S.chats.find(x=>x.id===id);if(!t||!c)return;
 c.msgs.push({from:'me',t:'text',text:t,time:now(),status:'sent'});c.last=t;c.time=now();c.status='sent';i.value='';save();refreshMsgs();
 const m=c.msgs[c.msgs.length-1];
 setTimeout(()=>{m.status='seen';c.status='seen';save();if(route().id===id)refreshMsgs()},900);
 if(c.type==='personal'){setTimeout(()=>{typingId=id;if(route().id===id)refreshMsgs()},1100);
  setTimeout(()=>{typingId=null;const r=REPLIES[Math.random()*REPLIES.length|0];c.msgs.push({from:'them',t:'text',text:r,time:now()});c.last=r;c.time=now();if(route().id===id){refreshMsgs()}else c.unread=(c.unread||0)+1;save()},2600)}}
function stopPlay(){if(playing){clearInterval(playing.t);playing=null}}
function play(i){const c=S.chats.find(x=>x.id===route().id),m=c.msgs[i],w=$('#w'+i),btn=w.previousElementSibling;
 if(playing&&playing.i===i){stopPlay();btn.innerHTML=ic('play',18);w.querySelectorAll('i').forEach(b=>b.classList.remove('on'));return}
 stopPlay();refreshMsgs();const w2=$('#w'+i),b2=w2.previousElementSibling,bs=[...w2.children];b2.innerHTML=ic('pause',18);let k=0;
 playing={i,t:setInterval(()=>{k++;bs.forEach((b,j)=>b.classList.toggle('on',j<k));if(k>=bs.length){stopPlay();b2.innerHTML=ic('play',18);bs.forEach(b=>b.classList.remove('on'))}},Math.max(60,m.dur*1000/bs.length/spd))}}
let ct;
function call(id,v){const p=PEOPLE[id]||{name:(S.chats.find(c=>c.id===id)||{}).name||''};let s=0;const d=document.createElement('div');d.className='call';
 d.innerHTML=`<div style="text-align:center">${av(p.name,128)}<h2>${esc(p.name)}</h2><p id="cs">در حال برقراری ${v?'تماس تصویری':'تماس صوتی'}…</p></div><button class="end" aria-label="پایان تماس">${ic('hang',28)}</button>`;
 app.append(d);setTimeout(()=>{ct=setInterval(()=>{s++;const e=$('#cs');if(e)e.textContent=fa(String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0'))},1000)},1500);
 d.querySelector('.end').onclick=()=>{clearInterval(ct);d.remove()}}
app.addEventListener('click',e=>{const t=e.target;
 const g=t.closest('[data-go]');const a=t.closest('[data-act]'),cl=t.closest('[data-call]'),f=t.closest('[data-f]'),mt=t.closest('[data-mt]'),to=t.closest('[data-toast]');
 if(a){const k=a.dataset.act,id=a.dataset.id;
  if(k==='search'){$('#sb').classList.toggle('on');$('#q').focus()}
  else if(k==='send')send();
  else if(k==='play')play(+a.dataset.i);
  else if(k==='spd'){spd=spd===1?1.5:spd===1.5?2:1;refreshMsgs()}
  else if(k==='emoji'){const i=$('#in');i.value+='😊';i.focus()}
  else if(k==='theme'){S.dark=!S.dark;applyTheme();save();render()}
  else if(k==='notif'){S.notif=!S.notif;save();render();toast(S.notif?'اعلان‌ها فعال شد':'اعلان‌ها خاموش شد')}
  else if(k==='clean'){S.clean=!S.clean;save();render()}
  else if(k==='mute'){S.muted[id]=!S.muted[id];save();render()}
  else if(k==='block'){const b=S.blocked[id];if(b||confirm('این مخاطب مسدود شود؟')){S.blocked[id]=!b;save();render()}}
  else if(k==='logout'){if(confirm('از حساب خود خارج می‌شوید؟')){Auth.logout();location.hash='chats';render()}}
  else if(k==='cache'){toast('حافظه کش پاک شد')}
  else if(k==='invite'||k==='share'){const txt=k==='share'?'مخاطب: '+PEOPLE[id].name+' @'+PEOPLE[id].user:'به پیام‌رسان پیام بپیوند!';
   if(navigator.share)navigator.share({title:'پیام',text:txt,url:location.href.split('#')[0]}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(txt+' '+location.href.split('#')[0]);toast('لینک کپی شد')}}
  else if(k==='install'&&deferred){deferred.prompt();deferred=null;render()}
  return}
 if(cl){call(cl.dataset.call,cl.dataset.v);return}
 if(f){filter=f.dataset.f;$('#list').innerHTML=chatRows();document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b===f));return}
 if(mt){mtab=+mt.dataset.mt;render();return}
 if(to){toast(to.dataset.toast);return}
 if(g){location.hash=g.dataset.go;return}
 const mg=t.closest('.msg');if(mg&&!t.closest('button')){}});
app.addEventListener('dblclick',e=>{const mg=e.target.closest('.msg'),c=S.chats.find(x=>x.id===route().id);if(!mg||!c)return;const m=c.msgs[+mg.dataset.i];if(m.react){delete m.react;delete m.rc}else{m.react='❤️';m.rc=1}save();refreshMsgs()});
app.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.trim();$('#list').innerHTML=chatRows()}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='in'){e.preventDefault();send()}});
window.addEventListener('hashchange',render);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(route().p==='settings')render()});
/* ───── Auth (محلی؛ بعداً با بک‌اند واقعی جایگزین می‌شود) ───── */
const Auth=(()=>{
const ADMIN=false,K='payam-user-auth-v1',SK='payam-user-session-v1';
let mode='login',err='',busy=false,idv='',done=()=>{};
const rd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const DB=()=>rd(K,{users:[],lock:{n:0,until:0}});
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const en=s=>s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
async function hash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:150000},k,256))}
function ident(v){v=en(String(v).trim());if(!v)return null;
 if(v.includes('@')){v=v.toLowerCase();return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)?{t:'email',v}:null}
 let p=v.replace(/[\s\-()+]/g,'');if(p.startsWith('0098'))p='0'+p.slice(4);else if(p.startsWith('98'))p='0'+p.slice(2);
 return /^09\d{9}$/.test(p)?{t:'phone',v:p}:null}
async function register(idr,pw,pw2){
 if(!(window.crypto&&crypto.subtle))return'مرورگر از رمزنگاری پشتیبانی نمی‌کند (آدرس باید HTTPS باشد)';
 const id=ident(idr);if(!id)return'ایمیل یا شماره موبایل معتبر وارد کنید (مثال: 09121234567)';
 if(pw.length<8||!/\d/.test(pw)||!/\p{L}/u.test(pw))return'رمز عبور باید حداقل ۸ کاراکتر و شامل حرف و عدد باشد';
 if(pw!==pw2)return'تکرار رمز عبور با رمز عبور یکسان نیست';
 const d=DB();
 if(ADMIN&&d.users.length)return'حساب مدیر قبلاً ایجاد شده است';
 if(d.users.some(u=>u.v===id.v))return'این حساب قبلاً ثبت‌نام کرده است';
 const salt=crypto.getRandomValues(new Uint8Array(16));
 const u={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),t:id.t,v:id.v,s:b64(salt),h:await hash(pw,salt),at:Date.now()};
 d.users.push(u);wr(K,d);wr(SK,{uid:u.id});return null}
async function login(idr,pw){
 if(!(window.crypto&&crypto.subtle))return'مرورگر از رمزنگاری پشتیبانی نمی‌کند (آدرس باید HTTPS باشد)';
 const d=DB(),now=Date.now();d.lock=d.lock||{n:0,until:0};
 if(d.lock.until>now)return'تلاش ناموفق زیاد بود؛ '+fa(Math.ceil((d.lock.until-now)/1000))+' ثانیه صبر کنید';
 const id=ident(idr),u=id&&d.users.find(x=>x.v===id.v);
 const ok=u&&(await hash(pw,unb(u.s)))===u.h;
 if(!ok){d.lock.n++;if(d.lock.n>=5)d.lock={n:0,until:now+30000};wr(K,d);return'ایمیل/شماره یا رمز عبور اشتباه است'}
 d.lock={n:0,until:0};wr(K,d);wr(SK,{uid:u.id});return null}
const user=()=>{const s=rd(SK,null);return s&&DB().users.find(u=>u.id===s.uid)||null};
const logout=()=>{try{localStorage.removeItem(SK)}catch(e){}mode='login';err='';idv='';busy=false};
const mask=()=>{const u=user();if(!u)return'';return u.t==='email'?u.v[0]+'***'+u.v.slice(u.v.indexOf('@')-1):u.v.slice(0,4)+'***'+u.v.slice(-4)};
const first=()=>ADMIN&&!DB().users.length;
const isReg=()=>ADMIN?first():mode==='reg';
function view(){const reg=isReg();
 const sub=ADMIN?(reg?'ایجاد حساب مدیر (اولین ورود)':'ورود به پنل مدیریت'):(reg?'ایجاد حساب جدید':'ورود به حساب');
 const pwf=(n,l,ac)=>`<label>${l}<span class="pw"><input name="${n}" type="password" dir="ltr" autocomplete="${ac}" required><button type="button" data-a="eye">نمایش</button></span></label>`;
 return `<div class="auth"><form class="acard" id="af" novalidate method="post" onsubmit="return false"><div class="alogo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ADMIN?'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>':'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>'}</svg></div><h1>${ADMIN?'پنل مدیریت پیام':'پیام'}</h1><p class="asub">${sub}</p>
${ADMIN?'':`<div class="atabs"><button type="button" data-a="tab" data-m="login" class="${reg?'':'on'}">ورود</button><button type="button" data-a="tab" data-m="reg" class="${reg?'on':''}">ثبت‌نام</button></div>`}
<label>ایمیل یا شماره موبایل<input name="ident" dir="ltr" autocomplete="username" inputmode="email" placeholder="name@example.com  یا  09123456789" value="${esc(idv)}" required></label>
${pwf('pw','رمز عبور',reg?'new-password':'current-password')}${reg?pwf('pw2','تکرار رمز عبور','new-password')+'<small class="hint">حداقل ۸ کاراکتر، شامل حرف و عدد</small>':''}
<div class="aerr" role="alert">${esc(err)}</div><button class="abtn" ${busy?'disabled':''}>${busy?'لطفاً صبر کنید…':reg?'ثبت‌نام':'ورود'}</button>
<p class="anote">فعلاً حساب‌ها فقط روی همین مرورگر ذخیره می‌شوند.</p></form></div>`}
const redraw=()=>{const a=document.querySelector('.auth');if(a)a.outerHTML=view()};
const keep=()=>{const i=document.querySelector('#af [name=ident]');if(i)idv=i.value};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;
 if(t.dataset.a==='tab'){keep();mode=t.dataset.m;err='';redraw()}
 else if(t.dataset.a==='eye'){const ins=[...document.querySelectorAll('#af [name^=pw]')],h=ins[0].type==='password';ins.forEach(i=>i.type=h?'text':'password');document.querySelectorAll('#af [data-a=eye]').forEach(b=>b.textContent=h?'پنهان':'نمایش')}});
document.addEventListener('submit',async e=>{if(!(e.target.matches&&e.target.matches('#af')))return;e.preventDefault();
 const f=new FormData(e.target),idr=String(f.get('ident')||''),pw=String(f.get('pw')||''),pw2=String(f.get('pw2')||'');
 if(busy)return;idv=idr;busy=true;err='';redraw();
 try{err=(isReg()?await register(idr,pw,pw2):await login(idr,pw))||''}catch(x){err='خطای غیرمنتظره؛ دوباره تلاش کنید'}
 busy=false;if(err)redraw();else{idv='';mode='login';done()}});
return{user,logout,mask,view,bind:cb=>{done=cb}}})();
applyTheme();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
