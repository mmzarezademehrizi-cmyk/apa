<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a" id="tc">

<title>پنل مدیریت پیام</title>
<style>
@font-face{font-family:Vazirmatn;src:url(fonts/Vazirmatn.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--pri:#2563eb;--pri2:#1d4ed8;--ink:#0f172a;--mut:#64748b;--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--chip:#e5eeff;--chipt:#1d4ed8;--field:#f1f5f9;--ok:#059669;--okbg:#d1fae5;--red:#dc2626;--redbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--sh:0 2px 8px -2px rgba(15,23,42,.06),0 1px 3px -1px rgba(15,23,42,.04)}
[data-theme=dark]{--ink:#e2e8f0;--mut:#94a3b8;--bg:#0b1220;--card:#131c2e;--line:#243049;--chip:#1b2a4a;--chipt:#93b4ff;--field:#1a2438;--okbg:#064e3b;--redbg:#4c1219;--warnbg:#4a3411;--ok:#34d399;--red:#f87171;--warn:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Vazirmatn,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-variant-numeric:tabular-nums;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.shell{display:flex;min-height:100vh}
aside{width:260px;background:var(--card);border-inline-end:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;flex:none;z-index:20}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.brand .lg{width:40px;height:40px;border-radius:12px;background:var(--pri);color:#fff;display:grid;place-items:center}
.brand b{display:block;font-size:16px;line-height:1.3}.brand small{color:var(--mut);font-size:11px}
.live{background:var(--chip);color:var(--chipt);border-radius:99px;padding:5px 12px;font-size:12px;display:flex;gap:8px;align-items:center;margin-bottom:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--okbg)}
aside a{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;color:var(--mut);font-size:14px;font-weight:500;cursor:pointer}
aside a:hover{background:var(--field)}
aside a.on{background:var(--pri);color:#fff;font-weight:600;box-shadow:0 6px 16px -4px rgba(37,99,235,.4)}
.ver{margin-top:auto;background:var(--chip);border-radius:12px;padding:10px 14px;font-size:12px;display:flex;justify-content:space-between;color:var(--chipt)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;gap:12px;align-items:center;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.bar .s{flex:1;max-width:520px;position:relative}
.bar .s input{width:100%;border:0;outline:0;background:var(--field);border-radius:99px;padding:9px 40px 9px 16px}
.bar .s svg{position:absolute;top:9px;inset-inline-start:14px;color:var(--mut)}
.bar .adm{margin-inline-start:auto;display:flex;gap:10px;align-items:center;font-size:12px}
.bar .adm small{color:var(--ok);display:block}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mut);position:relative}
.ib:hover{background:var(--field)}.ib .d{position:absolute;top:8px;inset-inline-end:9px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.menu{display:none}
.page{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1500px;width:100%}
.hd{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.hd .k{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--chipt);margin-bottom:4px}
.hd h2{font-size:24px;line-height:1.4}.hd p{color:var(--mut);font-size:13.5px;max-width:640px}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border-radius:99px;padding:9px 18px;font-size:13.5px;font-weight:600;background:var(--chip);color:var(--chipt);white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.p{background:var(--pri);color:#fff}.btn.p:hover{background:var(--pri2);filter:none}
.btn.r{background:var(--red);color:#fff}.btn.g{background:var(--field);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh);border-top:4px solid var(--pri);display:flex;flex-direction:column;gap:6px}
.kpi.red{border-top-color:var(--red)}.kpi.ok{border-top-color:var(--ok)}.kpi.warn{border-top-color:#f59e0b}
.kpi .l{font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center}
.kpi .v{font-size:32px;font-weight:700;line-height:1.2}
.kpi small{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h3{font-size:16px;display:flex;gap:8px;align-items:center}
.pc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.pcard .u{display:flex;gap:10px;align-items:center}
.pcard small{color:var(--mut);font-size:12px}
.pcard .a{display:flex;gap:6px;margin-top:4px}
.pcard .a .btn:first-child{flex:1}
.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:calc(var(--s)*.36);flex:none}
.pill{display:inline-flex;gap:4px;align-items:center;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.b{background:var(--chip);color:var(--chipt)}.pill.g{background:var(--okbg);color:var(--ok)}.pill.r{background:var(--redbg);color:var(--red)}.pill.y{background:var(--warnbg);color:var(--warn)}.pill.n{background:var(--field);color:var(--mut)}
.form{display:flex;flex-direction:column;gap:12px}
.form label{font-size:12.5px;font-weight:600;display:flex;flex-direction:column;gap:6px}
.form input[type=text],.form textarea,.fl select{border:1px solid var(--line);background:var(--field);border-radius:12px;padding:10px 14px;outline:0;width:100%}
.form input:focus,.form textarea:focus{border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.2)}
.radio{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:13px;font-weight:500}
.radio small{display:block;color:var(--mut);font-weight:400;font-size:11.5px}
.radio:has(input:checked){border-color:var(--pri);background:var(--chip)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;font-weight:600}
.tg input{appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:.2s;flex:none}
.tg input::after{content:"";position:absolute;top:3px;inset-inline-end:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked{background:var(--pri)}.tg input:checked::after{inset-inline-end:21px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:5px 14px;border-radius:99px;background:var(--chip);color:var(--chipt);font-size:12.5px;font-weight:500}
.chip.on{background:var(--pri);color:#fff}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
th{background:var(--field);color:var(--mut);font-weight:600;text-align:start;padding:12px 14px;font-size:12px;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr.sel td{background:rgba(37,99,235,.06)}
tr.click{cursor:pointer}tr.click:hover td{background:var(--field)}
.usr{display:flex;gap:10px;align-items:center}
.usr b{display:block;font-size:13.5px}.usr small{color:var(--mut);direction:ltr;display:block;text-align:right;font-size:11.5px}
.acts{display:flex;gap:2px}
.pg{display:flex;gap:6px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.pg .n{display:flex;gap:6px}.pg button{width:32px;height:32px;border-radius:50%;background:var(--field);font-weight:600;color:var(--ink)}.pg button.on{background:var(--pri);color:#fff}
.fl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fl input{border:0;background:var(--field);border-radius:99px;padding:8px 16px;outline:0;min-width:200px}
.case{border-inline-start:5px solid var(--red)}
.sus{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--bg);border-radius:14px;padding:14px}
.sus .i{flex:1;min-width:200px}.sus code,.mono{direction:ltr;unicode-bidi:embed;font-family:ui-monospace,monospace;font-size:12.5px}
.msgbox{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.lnk{background:var(--redbg);color:var(--red);border-radius:10px;padding:8px 12px;direction:ltr;font-family:ui-monospace,monospace;font-size:12.5px;display:flex;gap:8px;align-items:center;word-break:break-all}
.meter{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.meter div.t{display:flex;justify-content:space-between}
.meter .b{height:8px;border-radius:99px;background:var(--field);overflow:hidden}.meter .b i{display:block;height:100%;border-radius:99px}
.rowb{display:flex;gap:8px;flex-wrap:wrap}
.q{display:flex;flex-direction:column;gap:8px}
.qi{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:12.5px}
.qi:hover{outline:1px solid var(--pri)}
.mod{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.mod .box{background:var(--card);border-radius:22px;width:min(720px,100%);padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 40px rgba(0,0,0,.3);max-height:96vh;overflow:auto}
.ok-hero{background:linear-gradient(120deg,var(--okbg),var(--card));border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.steps{display:flex;gap:10px;flex-wrap:wrap}.steps .pill{padding:6px 14px}
.tl{display:flex;flex-direction:column;gap:10px}
.tl div{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border-radius:12px;padding:12px;font-size:13px}
.tl b{display:block}.tl small{color:var(--mut)}.tl .t{font-family:ui-monospace,monospace;color:var(--mut);font-size:12px;direction:ltr;flex:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 22px;border-radius:99px;font-size:13px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.empty{text-align:center;color:var(--mut);padding:30px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
@media(max-width:900px){aside{position:fixed;inset-block:0;inset-inline-start:0;transform:translateX(100%);transition:.25s;box-shadow:0 0 40px rgba(0,0,0,.2)}aside.open{transform:none}.menu{display:grid}.page{padding:16px}.bar{padding:10px 14px}.bar .adm span{display:none}.hd h2{font-size:20px}}
.auth{flex:1;min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;background:radial-gradient(900px 420px at 50% -8%,rgba(37,99,235,.2),transparent),var(--bg)}
.authov{position:fixed;inset:0;z-index:100;display:flex;background:var(--bg)}
.acard{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px -20px rgba(15,23,42,.3)}
.alogo{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;display:grid;place-items:center;margin:0 auto}
.acard h1{text-align:center;font-size:22px;color:var(--ink)}
.asub{text-align:center;color:var(--mut);font-size:14px;margin-top:-6px}
.atabs{display:flex;background:var(--field);border-radius:99px;padding:4px}
.atabs button{flex:1;padding:8px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mut)}
.atabs button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.acard label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
.acard input{width:100%;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:11px 14px;font:inherit;color:var(--ink);outline:0;text-align:left}
.acard input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.pw{position:relative;display:block}
.pw input{padding-inline-start:64px}
.pw button{position:absolute;inset-inline-start:6px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--pri);font-weight:700;padding:4px 8px}
.hint{color:var(--mut);font-size:12px;margin-top:-4px}
.aerr{min-height:20px;color:var(--red);font-size:13px;font-weight:600}
.abtn{background:var(--pri);color:#fff;border-radius:99px;padding:12px;font-weight:700;font-size:15px}
.abtn:disabled{opacity:.6}
.anote{text-align:center;color:var(--mut);font-size:11.5px}
</style>
</head>

/* ───── Auth (محلی؛ بعداً با بک‌اند واقعی جایگزین می‌شود) ───── */
const Auth=(()=>{
const ADMIN=true,K='payam-admin-auth-v1',SK='payam-admin-session-v1';
let mode='login',err='',busy=false,idv='',done=()=>{};
const rd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const DB=()=>rd(K,{users:[],lock:{n:0,until:0}});
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const en=s=>s.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
async function hash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:150000},k,256))}
function ident(v){v=en(String(v).trim());if(!v)return null;
 if(v.includes('@')){v=v.toLowerCase();return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)?{t:'email',v}:null}
 let p=v.replace(/[\s\-()+]/g,'');if(p.startsWith('0098'))p='0'+p.slice(4);else if(p.startsWith('98'))p='0'+p.slice(2);
 return /^09\d{9}$/.test(p)?{t:'phone',v:p}:null}
async function register(idr,pw,pw2){
 if(!(window.crypto&&crypto.subtle))return'مرورگر از رمزنگاری پشتیبانی نمی‌کند (آدرس باید HTTPS باشد)';
 const id=ident(idr);if(!id)return'ایمیل یا شماره موبایل معتبر وارد کنید (مثال: 09121234567)';
 if(pw.length<8||!/\d/.test(pw)||!/\p{L}/u.test(pw))return'رمز عبور باید حداقل ۸ کاراکتر و شامل حرف و عدد باشد';
 if(pw!==pw2)return'تکرار رمز عبور با رمز عبور یکسان نیست';
 const d=DB();
 if(ADMIN&&d.users.length)return'حساب مدیر قبلاً ایجاد شده است';
 if(d.users.some(u=>u.v===id.v))return'این حساب قبلاً ثبت‌نام کرده است';
 const salt=crypto.getRandomValues(new Uint8Array(16));
 const u={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),t:id.t,v:id.v,s:b64(salt),h:await hash(pw,salt),at:Date.now()};
 d.users.push(u);wr(K,d);wr(SK,{uid:u.id});return null}
async function login(idr,pw){
 if(!(window.crypto&&crypto.subtle))return'مرورگر از رمزنگاری پشتیبانی نمی‌کند (آدرس باید HTTPS باشد)';
 const d=DB(),now=Date.now();d.lock=d.lock||{n:0,until:0};
 if(d.lock.until>now)return'تلاش ناموفق زیاد بود؛ '+fa(Math.ceil((d.lock.until-now)/1000))+' ثانیه صبر کنید';
 const id=ident(idr),u=id&&d.users.find(x=>x.v===id.v);
 const ok=u&&(await hash(pw,unb(u.s)))===u.h;
 if(!ok){d.lock.n++;if(d.lock.n>=5)d.lock={n:0,until:now+30000};wr(K,d);return'ایمیل/شماره یا رمز عبور اشتباه است'}
 d.lock={n:0,until:0};wr(K,d);wr(SK,{uid:u.id});return null}
const user=()=>{const s=rd(SK,null);return s&&DB().users.find(u=>u.id===s.uid)||null};
const logout=()=>{try{localStorage.removeItem(SK)}catch(e){}mode='login';err='';idv='';busy=false};
const mask=()=>{const u=user();if(!u)return'';return u.t==='email'?u.v[0]+'***'+u.v.slice(u.v.indexOf('@')-1):u.v.slice(0,4)+'***'+u.v.slice(-4)};

 const sub=ADMIN?(reg?'ایجاد حساب مدیر (اولین ورود)':'ورود به پنل مدیریت'):(reg?'ایجاد حساب جدید':'ورود به حساب');
 const pwf=(n,l,ac)=>`<label>${l}<span class="pw"><input name="${n}" type="password" dir="ltr" autocomplete="${ac}" required><button type="button" data-a="eye">نمایش</button></span></label>`;
 return `<div class="auth"><form class="acard" id="af" novalidate><div class="alogo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ADMIN?'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>':'<path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/>'}</svg></div><h1>${ADMIN?'پنل مدیریت پیام':'پیام'}</h1><p class="asub">${sub}</p>
${ADMIN?'':`<div class="atabs"><button type="button" data-a="tab" data-m="login" class="${reg?'':'on'}">ورود</button><button type="button" data-a="tab" data-m="reg" class="${reg?'on':''}">ثبت‌نام</button></div>`}
<label>ایمیل یا شماره موبایل<input name="id" dir="ltr" autocomplete="username" inputmode="email" placeholder="name@example.com  یا  09123456789" value="${esc(idv)}" required></label>
${pwf('pw','رمز عبور',reg?'new-password':'current-password')}${reg?pwf('pw2','تکرار رمز عبور','new-password')+'<small class="hint">حداقل ۸ کاراکتر، شامل حرف و عدد</small>':''}
<div class="aerr" role="alert">${esc(err)}</div><button class="abtn" ${busy?'disabled':''}>${busy?'لطفاً صبر کنید…':reg?'ثبت‌نام':'ورود'}</button>
<p class="anote">فعلاً حساب‌ها فقط روی همین مرورگر ذخیره می‌شوند.</p></form></div>`}
const redraw=()=>{const a=document.querySelector('.auth');if(a)a.outerHTML=view()};
const keep=()=>{const i=document.querySelector('#af [name=id]');if(i)idv=i.value};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;
 if(t.dataset.a==='tab'){keep();mode=t.dataset.m;err='';redraw()}
 else if(t.dataset.a==='eye'){const ins=[...document.querySelectorAll('#af [name^=pw]')],h=ins[0].type==='password';ins.forEach(i=>i.type=h?'text':'password');document.querySelectorAll('#af [data-a=eye]').forEach(b=>b.textContent=h?'پنهان':'نمایش')}});
document.addEventListener('submit',async e=>{if(e.target.id!=='af')return;e.preventDefault();
 const f=new FormData(e.target),idr=String(f.get('id')||''),pw=String(f.get('pw')||''),pw2=String(f.get('pw2')||'');
 if(busy)return;idv=idr;busy=true;err='';redraw();
 try{err=(isReg()?await register(idr,pw,pw2):await login(idr,pw))||''}catch(x){err='خطای غیرمنتظره؛ دوباره تلاش کنید'}
 busy=false;if(err)redraw();else{idv='';mode='login';done()}});
return{user,logout,mask,view,bind:cb=>{done=cb}}})();
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
